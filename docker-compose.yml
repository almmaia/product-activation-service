services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider:8080
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
  provider:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./docker/wiremock:/home/wiremock/mappings:ro
    ports: ["8081:8080"]
